services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-energy} -d energy"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      # Solo accesible desde tu máquina. Puerto 5433 para no chocar con un Postgres local.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD}@db:5432/energy?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_USER: ${AUTH_USER:-demo}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?define AUTH_PASSWORD_HASH en .env (ver .env.example)}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (ver .env.example)}
      JWT_TTL: ${JWT_TTL:-8h}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"

  web:
    build:
      context: frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:8080"

volumes:
  pgdata: