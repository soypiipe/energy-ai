openapi: 3.0.3
info:
  title: Voltix · API de gestión de energía con IA
  version: 1.0.0
  description: |
    API REST del MVP de gestión de energía. Recibe lecturas horarias de medidores eléctricos, detecta
    anomalías con un motor estadístico, genera una explicación y una acción recomendada para cada una, y las
    prioriza para que el operador sepa qué atender primero (triage).

    ## Flujo típico

    1. `POST /auth/login` → devuelve un JWT.
    2. Botón **Authorize** → pegar el `access_token` (sin el prefijo `Bearer`). Se envía como `Authorization: Bearer <token>`.
    3. `POST /ai/analyze` → encola un análisis y responde `202` de inmediato.
    4. `GET /ai/analysis/{id}` (polling) hasta que `status = COMPLETED`.
    5. `GET /anomalies` → anomalías ordenadas por prioridad; `GET /anomalies/{id}` → evidencia y explicación.

    ## Cómo funciona

    - **Motor de análisis:** funciones puras en Go. Calcula un *baseline* por medidor y hora del día (mediana + MAD de los
      primeros 7 días) y aplica detectores: cambio de nivel sostenido (≥24 h, ±25 %), desviación transitoria (z robusto),
      cambios eléctricos (corriente, voltaje, factor de potencia) y calidad de datos (coherencia física kWh ≈ V·I·FP).
    - **Clasificación:** reglas en orden: `DATA_QUALITY` → `FALSE_POSITIVE` → `EXPLAINABLE_ANOMALY` → `REAL_ANOMALY`. Un evento
      reportado a ±2 h del inicio puede explicar el cambio (`OPERATIONAL_CHANGE`, `SCHEDULED_OUTAGE`); `UNKNOWN` no explica nada.
    - **Prioridad:** `severidad × magnitud × confianza`. Las fórmulas son deterministas.
    - **IA:** un LLM (opcional) solo redacta `reason` y `recommended_action` a partir de la evidencia ya calculada; no decide
      tipo ni severidad. Sin LLM, o si falla, se usa una plantilla determinista (`explanation_source` indica cuál).
    - **Ejecución asíncrona:** el análisis corre en un worker sobre una cola en PostgreSQL (`analysis_runs`, `FOR UPDATE SKIP LOCKED`).

    ## Convenciones

    - **Autenticación:** JWT HS256 con expiración. Todos los endpoints la exigen salvo `/health`, `/auth/login` y esta documentación.
    - **Errores:** todos siguen la forma `{"error": {"code": "...", "message": "..."}}`. `code` es estable y pensado para
      código cliente; `message` es legible. Los errores internos (`500`) nunca exponen detalles: el detalle queda en el log del servidor.
    - **Fechas:** las lecturas y eventos usan hora local de planta **sin zona horaria** (`2026-09-12T14:00:00`). Los instantes de
      ejecución (`created_at`, `finished_at`) son UTC (RFC 3339).
    - **Identificadores:** medidores `M-109` (patrón `^[A-Z]{1,4}-[0-9]{1,6}$`); anomalías y análisis usan UUID.
  contact:
    name: Voltix
servers:
  - url: .
    description: Este mismo servidor

tags:
  - name: Sistema
    description: Salud del servicio.
  - name: Acceso
    description: Autenticación. Emite el JWT que exigen los demás endpoints.
  - name: Medidores
    description: Consulta de medidores, lecturas horarias y eventos operativos.
  - name: Análisis con IA
    description: Ejecución asíncrona del análisis y seguimiento de su progreso.
  - name: Anomalías
    description: Resultado del análisis, ordenado por prioridad, y su seguimiento (abierta, reconocida, resuelta).
  - name: Dashboard
    description: KPIs agregados para la pantalla principal.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio
      description: |
        Health check. Verifica que el proceso responde y que hay conexión con PostgreSQL (`Ping`).
        Pensado para monitoreo y para el `healthcheck` de contenedores. No requiere autenticación.
      security: []
      responses:
        '200':
          description: El servicio y la base de datos responden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: El proceso está vivo pero no hay conexión con la base de datos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                dbUnavailable:
                  summary: Base de datos no disponible
                  value: { error: { code: DB_UNAVAILABLE, message: 'Base de datos no disponible' } }

  /auth/login:
    post:
      tags: [Acceso]
      summary: Iniciar sesión
      description: |
        Valida usuario y contraseña (hash bcrypt) y emite un JWT firmado con HS256. El token expira a los
        `expires_in` segundos; después hay que autenticarse de nuevo (no hay refresh token). No requiere autenticación.

        **Seguridad:** el servidor ejecuta bcrypt aunque el usuario no exista y responde siempre el mismo error, para no revelar
        qué usuarios existen. Hay un límite de **10 intentos por minuto por IP** (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'Autenticación correcta. La respuesta lleva `Cache-Control: no-store`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Cuerpo inválido. No es JSON, faltan `username` o `password`, o trae campos desconocidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidBody:
                  summary: Cuerpo inválido
                  value: { error: { code: INVALID_BODY, message: 'El cuerpo debe ser {"username": "...", "password": "..."}' } }
        '401':
          description: Usuario o contraseña incorrectos. El mensaje es el mismo para ambos casos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidCredentials:
                  summary: Credenciales incorrectas
                  value: { error: { code: INVALID_CREDENTIALS, message: 'Usuario o contraseña incorrectos' } }
        '429':
          description: Se superó el límite de intentos. Reintentar después de los segundos indicados en `Retry-After`.
          headers:
            Retry-After:
              description: Segundos de espera.
              schema: { type: integer, example: 60 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooManyAttempts:
                  summary: Demasiados intentos
                  value: { error: { code: TOO_MANY_ATTEMPTS, message: 'Demasiados intentos. Espera un minuto.' } }
        '500': { $ref: '#/components/responses/InternalError' }

  /meters:
    get:
      tags: [Medidores]
      summary: Listar medidores
      description: |
        Devuelve todos los medidores con su resumen: consumo total, consumo de las últimas 24 h del dataset, baseline diario
        (promedio de los primeros 7 días), variación porcentual y estado operativo.

        El estado se deriva de la anomalía de mayor prioridad del **último análisis completado**:
        `CRITICAL` (anomalía real de severidad alta), `ALERT` (cualquier otra que requiera atención) u `OK` (sin anomalía o falso positivo).
        Antes del primer análisis todos son `OK`.

        Filtrado, búsqueda y orden se hacen en el cliente: son pocas filas y no justifican paginación en el servidor.
      responses:
        '200':
          description: Lista de medidores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MeterSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /meters/{meterId}:
    get:
      tags: [Medidores]
      summary: Detalle de un medidor
      description: |
        Mismo resumen que el listado para un solo medidor, más sus **eventos operativos** (cambios de operación, apagados
        programados, problemas de datos). Los eventos son los que el motor usa para correlacionar y explicar las anomalías.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: Medidor con sus eventos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeterDetail' }
        '400': { $ref: '#/components/responses/InvalidMeterId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MeterNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /meters/{meterId}/readings:
    get:
      tags: [Medidores]
      summary: Lecturas horarias de un medidor
      description: |
        Serie temporal de lecturas horarias: consumo (kWh), voltaje (V), corriente (A) y factor de potencia. Es la fuente de las
        gráficas. Ordenada de la más antigua a la más reciente.

        `from` y `to` son opcionales e inclusivos, en formato `YYYY-MM-DDTHH:MM:SS` (hora local de planta, sin zona).
        Sin ellos devuelve todo el periodo (14 días × 24 h = 336 lecturas por medidor).
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - name: from
          in: query
          description: Inicio del rango (inclusive).
          schema: { type: string, example: '2026-09-10T00:00:00' }
        - name: to
          in: query
          description: Fin del rango (inclusive).
          schema: { type: string, example: '2026-09-14T23:00:00' }
      responses:
        '200':
          description: Lecturas del medidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meter_id: { type: string, example: M-109 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reading' }
        '400':
          description: Parámetro inválido. El `meterId` no cumple el patrón, `from` o `to` no tienen el formato esperado, o `from` es posterior a `to`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidMeterId:
                  summary: meterId con formato inválido
                  value: { error: { code: INVALID_METER_ID, message: 'meterId inválido (ejemplo: M-109)' } }
                invalidFrom:
                  summary: from con formato inválido
                  value: { error: { code: INVALID_FROM, message: 'from debe tener formato 2006-01-02T15:04:05' } }
                invalidTo:
                  summary: to con formato inválido
                  value: { error: { code: INVALID_TO, message: 'to debe tener formato 2006-01-02T15:04:05' } }
                invalidRange:
                  summary: from posterior a to
                  value: { error: { code: INVALID_RANGE, message: 'from debe ser anterior a to' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MeterNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/analyze:
    post:
      tags: [Análisis con IA]
      summary: Ejecutar el análisis (Run AI Analysis)
      description: |
        Encola un análisis de todos los medidores y responde `202 Accepted` sin esperar el resultado. Un worker en segundo plano
        toma el trabajo de la cola y recorre cuatro pasos: `loading_data` → `detecting_anomalies` → `explaining` → `saving_results`.

        Es idempotente frente a dobles clics: si ya hay un análisis `PENDING` o `RUNNING`, devuelve ese mismo en lugar de crear otro.
        El seguimiento se hace con `GET /ai/analysis/{id}` (ver cabecera `Location`).
      responses:
        '202':
          description: Análisis aceptado (nuevo o ya en curso).
          headers:
            Location:
              description: URL para consultar el estado.
              schema: { type: string, example: /ai/analysis/0b7c5e0e-6b0a-4a4e-9a55-0c9c0c1f1a11 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/analysis/{id}:
    get:
      tags: [Análisis con IA]
      summary: Consultar el estado de un análisis
      description: |
        Devuelve el estado de una ejecución: `PENDING` (en cola), `RUNNING` (con `current_step`), `COMPLETED` (con `summary`) o
        `FAILED`. Pensado para polling cada 1–2 s. Al completarse, las anomalías están disponibles en `GET /anomalies`.

        Si la ejecución falla, `error` contiene un mensaje genérico: el detalle técnico se registra en el servidor y no se expone.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID devuelto por `POST /ai/analyze`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado de la ejecución.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '400': { $ref: '#/components/responses/InvalidId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe un análisis con ese `id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notFound:
                  summary: Análisis inexistente
                  value: { error: { code: ANALYSIS_NOT_FOUND, message: 'El análisis no existe' } }
        '500': { $ref: '#/components/responses/InternalError' }

  /anomalies:
    get:
      tags: [Anomalías]
      summary: Listar anomalías por prioridad
      description: |
        Devuelve las anomalías del **último análisis completado**, ordenadas por `priority_score` descendente (la primera es la
        que se debe atender antes). Cada una incluye la explicación (`reason`) y la acción recomendada.

        Sin ningún análisis completado devuelve `analysis_id: null` y una lista vacía (no es un error).
        Los filtros son opcionales, combinables y se validan contra listas cerradas antes de consultar la base de datos.
      parameters:
        - name: meter_id
          in: query
          description: Filtra por medidor.
          schema: { type: string, example: M-109 }
        - name: type
          in: query
          description: Filtra por tipo de anomalía.
          schema: { $ref: '#/components/schemas/AnomalyType' }
        - name: severity
          in: query
          description: Filtra por severidad.
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          description: Filtra por estado de seguimiento.
          schema: { $ref: '#/components/schemas/AnomalyStatus' }
      responses:
        '200':
          description: Anomalías del último análisis (posiblemente vacía).
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: Análisis del que provienen. `null` si nunca se ha completado uno.
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Anomaly' }
        '400':
          description: Algún filtro no cumple el formato o no pertenece a los valores permitidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidMeterId:
                  summary: meter_id con formato inválido
                  value: { error: { code: INVALID_METER_ID, message: 'meter_id inválido (ejemplo: M-109)' } }
                invalidType:
                  summary: type no permitido
                  value: { error: { code: INVALID_TYPE, message: 'type inválido' } }
                invalidSeverity:
                  summary: severity no permitida
                  value: { error: { code: INVALID_SEVERITY, message: 'severity inválido' } }
                invalidStatus:
                  summary: status no permitido
                  value: { error: { code: INVALID_STATUS, message: 'status inválido' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /anomalies/{id}:
    get:
      tags: [Anomalías]
      summary: Detalle de una anomalía
      description: |
        Devuelve una anomalía con toda su **evidencia** auditable: los hallazgos de los detectores (métrica, baseline, valor
        observado y cambio %), el evento relacionado (si lo hay) y quién redactó la explicación (`explanation_source`).
        Es el origen de la pantalla de investigación.

        Funciona con anomalías de análisis anteriores, no solo del último.
      parameters:
        - $ref: '#/components/parameters/AnomalyId'
      responses:
        '200':
          description: Anomalía con su evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anomaly' }
        '400': { $ref: '#/components/responses/InvalidId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AnomalyNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Anomalías]
      summary: Actualizar el estado de una anomalía
      description: |
        Cambia únicamente el estado de seguimiento: `OPEN`, `ACKNOWLEDGED` o `RESOLVED`. Es la única parte editable: tipo,
        severidad, confianza y evidencia las calcula el motor y no se pueden modificar.

        El cuerpo se valida de forma estricta: cualquier campo distinto de `status` se rechaza.
      parameters:
        - $ref: '#/components/parameters/AnomalyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AnomalyStatus' }
      responses:
        '200':
          description: Anomalía con el estado actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anomaly' }
        '400':
          description: El `id` no es un UUID, el cuerpo no es JSON válido o trae campos desconocidos, o `status` no es un valor permitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidId:
                  summary: id con formato inválido
                  value: { error: { code: INVALID_ID, message: 'id inválido' } }
                invalidBody:
                  summary: Cuerpo inválido o con campos extra
                  value: { error: { code: INVALID_BODY, message: 'El cuerpo debe ser {"status": "OPEN|ACKNOWLEDGED|RESOLVED"}' } }
                invalidStatus:
                  summary: status no permitido
                  value: { error: { code: INVALID_STATUS, message: 'status debe ser OPEN, ACKNOWLEDGED o RESOLVED' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AnomalyNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: KPIs del dashboard
      description: |
        Agrega en una sola llamada lo que necesita la pantalla principal: medidores por estado, consumo de las últimas 24 h frente
        al baseline, anomalías del último análisis (totales, abiertas, por severidad y por tipo), la anomalía a atender primero
        (`top_priority`) y el último análisis completado.
      responses:
        '200':
          description: KPIs agregados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT devuelto por `POST /auth/login`. Pegar solo el token, sin el prefijo `Bearer`.

  parameters:
    MeterId:
      name: meterId
      in: path
      required: true
      description: Identificador del medidor.
      schema: { type: string, pattern: '^[A-Z]{1,4}-[0-9]{1,6}$', example: M-109 }
    AnomalyId:
      name: id
      in: path
      required: true
      description: UUID de la anomalía (campo `id` en `GET /anomalies`).
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: |
        No autenticado. El header `Authorization` falta, no usa el esquema `Bearer`, o el token es inválido o expiró.
        La respuesta incluye `WWW-Authenticate: Bearer`. Solución: iniciar sesión de nuevo con `POST /auth/login`.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="energy-ai"' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missingToken:
              summary: Sin token
              value: { error: { code: UNAUTHORIZED, message: 'Falta el token de acceso' } }
            invalidToken:
              summary: Token inválido o expirado
              value: { error: { code: UNAUTHORIZED, message: 'Token inválido o expirado' } }
    InternalError:
      description: Error interno del servidor. El detalle se registra en el log y nunca se envía al cliente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            internal:
              summary: Error interno
              value: { error: { code: INTERNAL, message: 'Error interno del servidor' } }
    InvalidMeterId:
      description: El `meterId` no cumple el patrón `^[A-Z]{1,4}-[0-9]{1,6}$`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidMeterId:
              summary: meterId con formato inválido
              value: { error: { code: INVALID_METER_ID, message: 'meterId inválido (ejemplo: M-109)' } }
    MeterNotFound:
      description: El identificador es válido pero no existe un medidor con ese id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              summary: Medidor inexistente
              value: { error: { code: METER_NOT_FOUND, message: 'El medidor no existe' } }
    InvalidId:
      description: El `id` no es un UUID válido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidId:
              summary: id con formato inválido
              value: { error: { code: INVALID_ID, message: 'id inválido' } }
    AnomalyNotFound:
      description: El identificador es válido pero no existe una anomalía con ese id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              summary: Anomalía inexistente
              value: { error: { code: ANOMALY_NOT_FOUND, message: 'La anomalía no existe' } }

  schemas:
    Error:
      type: object
      description: Formato único de error de toda la API.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable para código cliente.
              enum:
                - INVALID_BODY
                - INVALID_CREDENTIALS
                - TOO_MANY_ATTEMPTS
                - UNAUTHORIZED
                - INVALID_METER_ID
                - METER_NOT_FOUND
                - INVALID_FROM
                - INVALID_TO
                - INVALID_RANGE
                - INVALID_ID
                - ANALYSIS_NOT_FOUND
                - ANOMALY_NOT_FOUND
                - INVALID_TYPE
                - INVALID_SEVERITY
                - INVALID_STATUS
                - DB_UNAVAILABLE
                - INTERNAL
            message:
              type: string
              description: Mensaje legible.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: demo }
        password: { type: string, format: password, example: '<contraseña>' }

    LoginResponse:
      type: object
      properties:
        access_token: { type: string, description: JWT firmado (HS256). }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 28800, description: Vigencia del token en segundos. }

    MeterStatus:
      type: string
      enum: [OK, ALERT, CRITICAL]
      description: Estado operativo derivado del último análisis. `CRITICAL` = anomalía real de severidad alta; `ALERT` = otra anomalía que requiere atención; `OK` = sin anomalía o falso positivo.

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: Severidad asignada por las reglas de clasificación del motor.

    AnomalyType:
      type: string
      enum: [REAL_ANOMALY, EXPLAINABLE_ANOMALY, FALSE_POSITIVE, DATA_QUALITY]
      description: |
        Clasificación del motor.
        `REAL_ANOMALY`: desviación que ningún evento explica.
        `EXPLAINABLE_ANOMALY`: desviación que coincide con un evento operativo reportado.
        `FALSE_POSITIVE`: desviación transitoria prevista (p. ej. apagado programado).
        `DATA_QUALITY`: lecturas físicamente incoherentes; el problema es la medición, no el consumo.

    AnomalyStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED]
      description: Estado de seguimiento del operador.

    MeterSummary:
      type: object
      properties:
        meter_id: { type: string, example: M-109 }
        name: { type: string, example: Medidor M-109 }
        location: { type: string, nullable: true }
        total_kwh: { type: number, example: 17526.4, description: Consumo de todo el periodo (kWh). }
        current_kwh: { type: number, example: 2208.3, description: Consumo de las últimas 24 h del dataset (kWh). }
        baseline_kwh: { type: number, example: 1049.1, description: Consumo diario promedio de los primeros 7 días (kWh). }
        variation_pct: { type: number, example: 110.5, description: '(current_kwh / baseline_kwh − 1) × 100.' }
        status: { $ref: '#/components/schemas/MeterStatus' }
        anomaly_type:
          allOf: [{ $ref: '#/components/schemas/AnomalyType' }]
          nullable: true
          description: Tipo de la anomalía de mayor prioridad. `null` si no tiene.
        severity:
          allOf: [{ $ref: '#/components/schemas/Severity' }]
          nullable: true
        last_reading_at: { type: string, example: '2026-09-14T23:00:00', description: Última lectura (hora local de planta). }

    Event:
      type: object
      properties:
        timestamp: { type: string, example: '2026-09-12T14:00:00' }
        type:
          type: string
          enum: [OPERATIONAL_CHANGE, SCHEDULED_OUTAGE, DATA_QUALITY, UNKNOWN]
          description: |
            `OPERATIONAL_CHANGE` y `SCHEDULED_OUTAGE` explican un cambio de consumo.
            `DATA_QUALITY` describe un problema del sensor. `UNKNOWN` indica que no se reportó ninguna causa y no explica nada.
        description: { type: string, example: No operational event reported }

    MeterDetail:
      allOf:
        - $ref: '#/components/schemas/MeterSummary'
        - type: object
          properties:
            events:
              type: array
              items: { $ref: '#/components/schemas/Event' }

    Reading:
      type: object
      properties:
        timestamp: { type: string, example: '2026-09-12T14:00:00' }
        consumption_kwh: { type: number, example: 92.8 }
        voltage_v: { type: number, example: 218.4 }
        current_a: { type: number, example: 424.7 }
        power_factor: { type: number, example: 0.74, description: Factor de potencia (0 a 1). }
        status: { type: string, example: OK, description: Estado que reporta el propio medidor. Se ignora en el análisis (siempre dice OK, incluso con datos erróneos). }

    AnalysisRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        current_step:
          type: string
          nullable: true
          enum: [loading_data, detecting_anomalies, explaining, saving_results]
          description: Paso en curso mientras `status = RUNNING`.
        error: { type: string, nullable: true, description: Mensaje genérico si `status = FAILED`. El detalle técnico no se expone. }
        summary:
          type: object
          nullable: true
          description: Resumen del resultado; solo con `status = COMPLETED`.
          properties:
            meters_analyzed: { type: integer, example: 12 }
            anomalies: { type: integer, example: 4 }
            by_type:
              type: object
              additionalProperties: { type: integer }
              example: { REAL_ANOMALY: 1, DATA_QUALITY: 1, EXPLAINABLE_ANOMALY: 1, FALSE_POSITIVE: 1 }
            explained_by:
              type: object
              additionalProperties: { type: integer }
              description: Cantidad de explicaciones redactadas por cada fuente (`llm` o `template`).
              example: { template: 4 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    Evidence:
      type: object
      description: Una métrica observada comparada con su baseline.
      properties:
        metric:
          type: string
          example: consumption_kwh
          description: '`consumption_kwh`, `power_factor`, `current_a`, `voltage_v`, `kwh_vi_ratio` (coherencia física) o `flagged_readings` (conteo de lecturas incoherentes).'
        baseline: { type: number, example: 44.07 }
        observed: { type: number, example: 92.77 }
        change_pct: { type: number, example: 110.5 }

    Finding:
      type: object
      description: Hallazgo de un detector.
      properties:
        kind:
          type: string
          enum: [PERSISTENT_SHIFT, TRANSIENT_DEVIATION, ELECTRICAL_CHANGE, DATA_QUALITY]
          description: |
            `PERSISTENT_SHIFT`: cambio de nivel sostenido ≥24 h.
            `TRANSIENT_DEVIATION`: desviación de unas horas que vuelve a lo normal.
            `ELECTRICAL_CHANGE`: cambio sostenido en corriente, voltaje o factor de potencia.
            `DATA_QUALITY`: lecturas incoherentes con la relación física kWh ≈ V·I·FP.
        start: { type: string, example: '2026-09-12T14:00:00' }
        end: { type: string, nullable: true, description: Fin del hallazgo. `null` si sigue activo al final de los datos. }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }

    AnomalyEvidence:
      type: object
      properties:
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        related_event:
          type: object
          nullable: true
          description: Evento más cercano a ±2 h del inicio. `null` si no hay ninguno.
          properties:
            timestamp: { type: string }
            type: { type: string, example: UNKNOWN }
            description: { type: string }
        explanation_source:
          type: string
          enum: [llm, template]
          description: Quién redactó `reason` y `recommended_action`.

    Anomaly:
      type: object
      properties:
        id: { type: string, format: uuid }
        analysis_id: { type: string, format: uuid }
        meter_id: { type: string, example: M-109 }
        meter_name: { type: string, example: Medidor M-109 }
        detected_at: { type: string, example: '2026-09-12T14:00:00', description: Inicio del primer hallazgo (hora local de planta). }
        type: { $ref: '#/components/schemas/AnomalyType' }
        severity: { $ref: '#/components/schemas/Severity' }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.93 }
        priority_score: { type: number, example: 2.79, description: 'severidad × magnitud × confianza. Mayor = atender antes.' }
        reason: { type: string, description: Explicación de por qué se marcó, con las cifras de la evidencia. }
        recommended_action: { type: string, description: Acción sugerida al operador. }
        evidence: { $ref: '#/components/schemas/AnomalyEvidence' }
        status: { $ref: '#/components/schemas/AnomalyStatus' }
        created_at: { type: string, format: date-time }

    DashboardSummary:
      type: object
      properties:
        meters:
          type: object
          description: Medidores por estado operativo.
          properties:
            total: { type: integer, example: 12 }
            ok: { type: integer, example: 9 }
            alert: { type: integer, example: 2 }
            critical: { type: integer, example: 1 }
        consumption:
          type: object
          description: Consumo sumando todos los medidores (kWh).
          properties:
            total_kwh: { type: number }
            current_kwh: { type: number, description: Últimas 24 h. }
            baseline_kwh: { type: number, description: Baseline diario. }
            variation_pct: { type: number }
        anomalies:
          type: object
          description: Anomalías del último análisis.
          properties:
            total: { type: integer, example: 4 }
            open: { type: integer, example: 4 }
            high_priority: { type: integer, example: 2, description: Anomalías con severidad HIGH. }
            avg_confidence: { type: number, example: 0.82, description: Confianza media de la IA (0-1). 0 si no hay anomalías. }
            by_severity:
              type: object
              additionalProperties: { type: integer }
              example: { HIGH: 2, MEDIUM: 1, LOW: 1 }
            by_type:
              type: object
              additionalProperties: { type: integer }
        top_priority:
          type: object
          nullable: true
          description: Anomalía de mayor prioridad. `null` si no hay anomalías.
          properties:
            anomaly_id: { type: string, format: uuid }
            meter_id: { type: string, example: M-109 }
            type: { $ref: '#/components/schemas/AnomalyType' }
            severity: { $ref: '#/components/schemas/Severity' }
        last_analysis:
          type: object
          nullable: true
          description: Último análisis completado. `null` si nunca se ha ejecutado.
          properties:
            id: { type: string, format: uuid }
            status: { type: string, example: COMPLETED }
            finished_at: { type: string, format: date-time, nullable: true }
